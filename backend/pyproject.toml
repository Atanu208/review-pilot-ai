[project]
name = "reviewpilot-backend"
version = "0.1.0"
description = "ReviewPilot AI - intelligent code review and automated pull request analysis (API + workers)"
requires-python = ">=3.12,<3.14"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    "redis>=5.2,<7.0",
    "celery[redis]>=5.4,<6.0",
    "cryptography>=50,<51",
    "structlog>=24.4,<27",
    "httpx>=0.28,<1.0",
    "pyjwt[crypto]>=2.10,<3",
    "anthropic>=2.8,<3",
    "langgraph>=1.2,<2",
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-python>=0.25,<0.26",
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
    "tree-sitter-java>=0.23,<0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "bandit>=1.9,<2.0",
    "pip-audit>=2.10,<3.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["app/tests"]
markers = [
    "integration: requires PostgreSQL and Redis (docker compose or CI services)",
]
filterwarnings = ["ignore::DeprecationWarning:celery.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101", "B008", "RUF012"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"app/tests/**" = ["S105", "S106", "ASYNC240"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
exclude = ["alembic/", "app/tests/fixtures/"]

[[tool.mypy.overrides]]
# Celery ships without type hints; its decorators would otherwise fail strict mode.
module = ["app.workers.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# SQLAlchemy's AsyncSession.scalar()/get() are typed as returning Any.
module = ["app.repositories.*"]
warn_return_any = false

[tool.coverage.run]
# SQLAlchemy's asyncio layer runs on greenlets; without this, coverage under-reports.
concurrency = ["greenlet", "thread"]
source = ["app"]
omit = ["app/tests/*"]

[tool.setuptools.package-data]
# Semgrep rules are data files that must ship with the installed package.
"app.analysis" = ["rules/semgrep/*.yml"]
"app.ai.evals" = ["dataset.json"]
