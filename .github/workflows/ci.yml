name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: reviewpilot
          POSTGRES_PASSWORD: reviewpilot
          POSTGRES_DB: reviewpilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reviewpilot" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      REQUIRE_INTEGRATION: "1"
      REQUIRE_SEMGREP: "1"
      TEST_DATABASE_URL: postgresql+asyncpg://reviewpilot:reviewpilot@localhost:5432/reviewpilot_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install
        run: pip install -c requirements.lock -e ".[dev]"
      - name: Install Semgrep (isolated venv; its pins conflict with the app's)
        run: |
          python -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/pip" install semgrep==1.185.0
          echo "SEMGREP_BIN=$RUNNER_TEMP/semgrep/bin/semgrep" >> "$GITHUB_ENV"
      - name: Ruff
        run: ruff check app alembic && ruff format --check app alembic
      - name: Mypy
        run: mypy app
      - name: Pytest
        run: pytest --cov=app --cov-report=term-missing:skip-covered

  frontend:
    name: Frontend (lint, types, build, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  security:
    name: Security scans (SAST, dependencies, secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scanners
        run: pip install "bandit>=1.9,<2.0" "pip-audit>=2.10,<3.0"
      - name: Bandit (Python static analysis)
        run: bandit -q -r backend/app -x backend/app/tests
      - name: pip-audit (Python dependencies)
        run: pip-audit -r backend/requirements.lock --progress-spinner off
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: npm audit (frontend dependencies)
        working-directory: frontend
        run: npm audit --audit-level=moderate
      - name: Gitleaks (committed secrets)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
